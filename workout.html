<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전신 체력 루틴</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  </style>
</head>
<body>
  <div id="root">Loading...</div>
  <script>
    const {useState,useEffect,useRef,useCallback}=React;
    const html = htm.bind(React.createElement);

    const THEMES = {
      dark: {bg:"linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#0f0f1a 100%)",surface:"rgba(255,255,255,0.06)",surfaceHover:"rgba(255,255,255,0.09)",border:"rgba(255,255,255,0.1)",borderSub:"rgba(255,255,255,0.06)",card:"#16162a",sheet:"#13132a",text:"white",textSub:"rgba(255,255,255,0.5)",textMute:"rgba(255,255,255,0.3)",accent:"#FF6B35",timerStroke:"rgba(255,255,255,0.08)",dot:"rgba(255,255,255,0.13)",headerBorder:"rgba(255,255,255,0.06)"},
      light: {bg:"linear-gradient(135deg,#f0f0f8 0%,#e8e8f5 50%,#f0f0f8 100%)",surface:"rgba(0,0,0,0.05)",surfaceHover:"rgba(0,0,0,0.08)",border:"rgba(0,0,0,0.12)",borderSub:"rgba(0,0,0,0.06)",card:"#ffffff",sheet:"#f5f5fc",text:"#1a1a2e",textSub:"rgba(0,0,0,0.5)",textMute:"rgba(0,0,0,0.35)",accent:"#FF6B35",timerStroke:"rgba(0,0,0,0.08)",dot:"rgba(0,0,0,0.12)",headerBorder:"rgba(0,0,0,0.08)"},
    };

    function useSoundEngine(soundOn){
      const ctxRef = useRef(null);
      const bgmRef = useRef(null);
      const bgmOn = useRef(false);
      const soundOnRef = useRef(soundOn);
      soundOnRef.current = soundOn;
      const getCtx = useCallback(() => {
        if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        if (ctxRef.current.state === "suspended") ctxRef.current.resume();
        return ctxRef.current;
      }, []);
      const tone = useCallback((freq, dur, vol=0.25, type="sine") => {
        if (!soundOnRef.current) return;
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(vol, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
          osc.start(); osc.stop(ctx.currentTime + dur);
        } catch {}
      }, [getCtx]);
      const sfx = {
        start: useCallback(() => { tone(880,0.07); setTimeout(()=>tone(1100,0.1),80); setTimeout(()=>tone(1320,0.18),170); }, [tone]),
        done: useCallback(() => { tone(660,0.08); setTimeout(()=>tone(880,0.15),110); }, [tone]),
        rest: useCallback(() => { tone(440,0.22,0.2); }, [tone]),
        count: useCallback(() => { tone(1100,0.05,0.12); }, [tone]),
        repDone: useCallback(() => { tone(880,0.06); setTimeout(()=>tone(1200,0.12),70); }, [tone]),
        finish: useCallback(() => {[0,120,240,360,480].forEach((d,i)=>setTimeout(()=>tone([523,659,784,1047,1319][i],0.2,0.2),d));}, [tone])
      };
      const startBGM = useCallback(() => {
        if (!soundOnRef.current || bgmOn.current) return;
        bgmOn.current = true;
        try {
          const ctx = getCtx();
          const master = ctx.createGain();
          master.gain.value = 0.18;
          master.connect(ctx.destination);
          bgmRef.current = { master, timers: [] };
          const bpm = 120, step = 60 / bpm;
          const kick = (t) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(master);
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(0.01, t+0.4);
            g.gain.setValueAtTime(1, t);
            g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
            osc.start(t); osc.stop(t+0.5);
          };
          const hat = (t, vol=0.3) => {
            const buf = ctx.createBuffer(1,ctx.sampleRate*0.05,ctx.sampleRate);
            const d=buf.getChannelData(0);
            for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*vol;
            const src = ctx.createBufferSource();
            const flt = ctx.createBiquadFilter();
            flt.type="highpass"; flt.frequency.value=8000;
            const g = ctx.createGain();
            src.buffer=buf; src.connect(flt); flt.connect(g); g.connect(master);
            g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
            src.start(t); src.stop(t+0.1);
          };
          const bass = (t, freq=55) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type="square"; osc.connect(g); g.connect(master);
            osc.frequency.value=freq;
            g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
            osc.start(t); osc.stop(t+0.3);
          };
          const bassLine=[55,55,65,55,49,55,65,73];
          const loop = () => {
            const now = ctx.currentTime;
            for(let b=0;b<8;b++) {
              const t = now + b*step;
              if(b%2===0) kick(t);
              hat(t, b%2===0?0.5:0.3);
              bass(t, bassLine[b]);
            }
            const tid = setTimeout(loop,(8*step-0.1)*1000);
            if(bgmRef.current) bgmRef.current.timers.push(tid);
          };
          loop();
        } catch {}
      }, [getCtx]);
      const stopBGM = useCallback(() => {
        bgmOn.current = false;
        if (bgmRef.current) {
          bgmRef.current.timers.forEach(t => clearTimeout(t));
          try { bgmRef.current.master.gain.setValueAtTime(0, ctxRef.current.currentTime); } catch {}
          bgmRef.current = null;
        }
      }, []);
      return {sfx, startBGM, stopBGM};
    }

    function useAnim(period) { return 0; }
    const lerp = (a,b,t) => a+(b-a)*t;
    const eio = (t) => t<0.5?2*t*t:-1+(4-2*t)*t;
    const cl = (t,a,b) => Math.max(0,Math.min(1,(t-a)/(b-a)));
    const SW=5, JR=3.5;

    function AnimMountainClimber({color,small}) {
      const t = useAnim(1600);
      const drive = t<0.5?eio(cl(t,0,0.5)):t<0.7?1:eio(1-cl(t,0.7,1));
      const back = t<0.2?0:t<0.5?eio(cl(t-0.2,0,0.3)):t<0.7?1:eio(cl(t-0.5,0.2,0.5));
      const s = small ? {width:"100%",maxWidth:200} : {width:"100%"};
      return html`<svg viewBox="0 0 210 100" style=${s}>
        <line x1="10" y1="87" x2="200" y2="87" stroke="rgba(128,128,128,0.2)" strokeWidth="1.5"/>
        <line x1="40" y1="85" x2="45" y2="65" stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1="45" y1="65" x2="65" y2="55" stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1="65" y1="55" x2="130" y2="55" stroke=${color} stroke-width=${SW+1.5} stroke-linecap="round"/>
        <line x1="130" y1="55" x2=${lerp(175,115,back)} y2="55" stroke=${color} stroke-width=${SW} stroke-linecap="round" opacity="0.5"/>
        <line x1=${lerp(175,115,back)} y1="55" x2="190" y2="85" stroke=${color} stroke-width=${SW} stroke-linecap="round" opacity="0.5"/>
        <line x1="130" y1="55" x2=${lerp(160,110,drive)} y2="55" stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${lerp(160,110,drive)} y1="55" x2="175" y2="85" stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <circle cx="25" cy="25" r="11" fill=${color+"44"} stroke=${color} stroke-width="2.5"/>
        <line x1="25" y1="36" x2="65" y2="57" stroke=${color} stroke-width=${SW+1.5} stroke-linecap="round"/>
        <circle cx="65" cy="55" r=${JR} fill=${color}/>
        <circle cx="130" cy="55" r=${JR} fill=${color}/>
        <circle cx=${lerp(160,110,drive)} cy="55" r=${JR} fill=${color}/>
        <text x="105" y="97" text-anchor="middle" fill="rgba(128,128,128,0.6)" font-size="8.5" font-family="'Noto Sans KR',sans-serif">플랭크 · 무릎을 가슴으로 당기기</text>
      </svg>`;
    }

    function AnimWideSquat({color,small}) {
      const t = useAnim(2000);
      const down = t<0.4?eio(t/0.4):t<0.6?1:eio(1-(t-0.6)/0.4);
      const cx=100;
      const headY=lerp(12,24,down);
      const torsoY=lerp(38,52,down);
      const hipY=lerp(55,75,down);
      const kneeL_X=lerp(75,50,down), kneeY=lerp(70,82,down);
      const kneeR_X=lerp(125,150,down);
      const footL_X=lerp(65,35,down), footY=92;
      const footR_X=lerp(135,165,down);
      const s = small ? {width:"100%",maxWidth:200} : {width:"100%"};
      return html`<svg viewBox="0 0 200 104" style=${s}>
        <line x1="28" y1="91" x2="172" y2="91" stroke="rgba(128,128,128,0.2)" stroke-width="1.5"/>
        <line x1=${cx} y1=${headY+10} x2=${cx} y2=${torsoY} stroke=${color} stroke-width=${SW+1.5} stroke-linecap="round"/>
        <line x1=${cx} y1=${torsoY} x2=${kneeL_X} y2=${kneeY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${kneeL_X} y1=${kneeY} x2=${footL_X} y2=${footY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${cx} y1=${torsoY} x2=${kneeR_X} y2=${kneeY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${kneeR_X} y1=${kneeY} x2=${footR_X} y2=${footY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <circle cx=${cx} cy=${headY} r="11" fill=${color+"44"} stroke=${color} stroke-width="2.5"/>
        <circle cx=${cx} cy=${torsoY} r=${JR-0.5} fill=${color}/>
        <circle cx=${cx} cy=${hipY} r=${JR-0.5} fill=${color}/>
        <circle cx=${kneeL_X} cy=${kneeY} r=${JR-0.5} fill=${color}/>
        <circle cx=${kneeR_X} cy=${kneeY} r=${JR-0.5} fill=${color}/>
        <text x=${cx} y="101" text-anchor="middle" fill="rgba(128,128,128,0.6)" font-size="8.5" font-family="'Noto Sans KR',sans-serif">발 1.5배 · 무릎 발끝 방향</text>
      </svg>`;
    }

    function AnimShoulderTapPushup({color,small}) {
      const t = useAnim(2800);
      const down = t<0.25?eio(cl(t,0,0.25)):t<0.35?1:eio(1-cl(t,0.35,0.45));
      const up = t<0.45?0:t<0.65?eio(cl(t-0.45,0,0.2)):t<0.75?1:eio(1-cl(t-0.65,0.1,0.2));
      const shoulderX=60, shoulderY=lerp(40,55,down);
      const elbowX=45, elbowY=lerp(55,70,down);
      const hipX=155, hipY=50;
      const kneeX=180, kneeY=85;
      const tapArmX=lerp(shoulderX,shoulderX-20,up), tapArmY=lerp(shoulderY,shoulderY+15,up);
      const s = small ? {width:"100%",maxWidth:200} : {width:"100%"};
      return html`<svg viewBox="0 0 210 100" style=${s}>
        <line x1="10" y1="87" x2="200" y2="87" stroke="rgba(128,128,128,0.2)" stroke-width="1.5"/>
        <line x1="30" y1="80" x2=${elbowX} y2=${elbowY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${elbowX} y1=${elbowY} x2=${shoulderX} y2=${shoulderY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${shoulderX} y1=${shoulderY} x2=${hipX} y2=${hipY} stroke=${color} stroke-width=${SW+1.5} stroke-linecap="round"/>
        <line x1=${hipX} y1=${hipY} x2=${kneeX} y2=${kneeY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${kneeX} y1=${kneeY} x2="195" y2=${kneeY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        ${up>0.5 ? html`<line x1=${shoulderX-5} y1=${shoulderY} x2=${tapArmX} y2=${tapArmY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/><circle cx=${tapArmX-5} cy=${tapArmY-5} r="3" fill=${color}/>` : ''}
        <circle cx="28" cy="30" r="11" fill=${color+"44"} stroke=${color} stroke-width="2.5"/>
        <circle cx=${shoulderX} cy=${shoulderY} r=${JR} fill=${color}/>
        <circle cx=${elbowX} cy=${elbowY} r=${JR} fill=${color}/>
        <circle cx=${hipX} cy=${hipY} r=${JR} fill=${color}/>
        <circle cx=${kneeX} cy=${kneeY} r=${JR} fill=${color}/>
        <circle cx="30" cy="80" r=${JR} fill=${color}/>
        <text x="105" y="97" text-anchor="middle" fill="rgba(128,128,128,0.6)" font-size="8.5" font-family="'Noto Sans KR',sans-serif">푸시업 · 반대 어깨 탭</text>
      </svg>`;
    }

    function AnimStepBackLunge({color,small}) {
      const t = useAnim(2400);
      const step = t<0.25?eio(cl(t,0,0.25)):t<0.35?1:t<0.55?eio(1-cl(t,0.35,0.55)):t<0.65?1:eio(1-cl(t,0.65,0.85));
      const cx=100;
      const headY=lerp(14,22,step);
      const torsoY=lerp(38,48,step);
      const hipY=lerp(58,78,step);
      const frontKneeX=lerp(108,115,step), frontKneeY=lerp(72,90,step);
      const frontFootX=130, frontFootY=92;
      const backFootX=lerp(90,35,step), backFootY=92;
      const backKneeX=lerp(85,50,step), backKneeY=lerp(72,90,step);
      const s = small ? {width:"100%",maxWidth:200} : {width:"100%"};
      return html`<svg viewBox="0 0 200 104" style=${s}>
        <line x1="18" y1="91" x2="182" y2="91" stroke="rgba(128,128,128,0.2)" stroke-width="1.5"/>
        <line x1=${cx} y1=${headY+12} x2=${cx} y2=${torsoY} stroke=${color} stroke-width=${SW+1.5} stroke-linecap="round"/>
        <line x1=${cx} y1=${torsoY} x2=${cx} y2=${hipY} stroke=${color} stroke-width=${SW+1.5} stroke-linecap="round"/>
        <line x1=${cx} y1=${hipY} x2=${frontKneeX} y2=${frontKneeY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${frontKneeX} y1=${frontKneeY} x2=${frontFootX} y2=${frontFootY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${cx} y1=${hipY} x2=${backKneeX} y2=${backKneeY} stroke=${color} stroke-width=${SW} stroke-linecap="round" opacity="0.5"/>
        <line x1=${backKneeX} y1=${backKneeY} x2=${backFootX} y2=${backFootY} stroke=${color} stroke-width=${SW} stroke-linecap="round" opacity="0.5"/>
        <circle cx=${cx} cy=${headY} r="11" fill=${color+"44"} stroke=${color} stroke-width="2.5"/>
        <circle cx=${cx} cy=${torsoY} r=${JR} fill=${color}/>
        <circle cx=${cx} cy=${hipY} r=${JR} fill=${color}/>
        <circle cx=${frontKneeX} cy=${frontKneeY} r=${JR} fill=${color}/>
        <circle cx=${frontFootX} cy=${frontFootY} r=${JR-1} fill=${color} opacity="0.5"/>
        <circle cx=${backKneeX} cy=${backKneeY} r=${JR-1} fill=${color} opacity="0.5"/>
        <circle cx=${backFootX} cy=${backFootY} r=${JR-1} fill=${color} opacity="0.5"/>
        <text x="100" y="101" text-anchor="middle" fill="rgba(128,128,128,0.6)" font-size="8.5" font-family="'Noto Sans KR',sans-serif">뒤로 · 앞무릎 90도</text>
      </svg>`;
    }

    function AnimSideLunge({color,small}) {
      const t = useAnim(2600);
      const toSide = t<0.3?eio(cl(t,0,0.3)):t<0.4?1:t<0.5?eio(1-cl(t,0.4,0.5)):0;
      const back = t<0.55?0:t<0.7?eio(cl(t-0.55,0,0.15)):t<0.8?1:eio(1-cl(t,0.65,0.8));
      const dir = toSide>0.5?1:-1;
      const cx=100;
      const headY=lerp(14,22,toSide);
      const torsoY=lerp(38,52,toSide);
      const hipX=lerp(100,100+dir*30,toSide), hipY=lerp(58,75,toSide);
      const kneeX=dir>0?lerp(100,145,toSide):lerp(100,55,toSide);
      const kneeY=lerp(72,85,toSide);
      const footX=dir>0?lerp(130,165,toSide):lerp(70,35,toSide);
      const footY=92;
      const otherKneeX=dir>0?85:115, otherKneeY=72;
      const otherFootX=dir>0?75:125, otherFootY=92;
      const s = small ? {width:"100%",maxWidth:200} : {width:"100%"};
      return html`<svg viewBox="0 0 200 104" style=${s}>
        <line x1="18" y1="91" x2="182" y2="91" stroke="rgba(128,128,128,0.2)" stroke-width="1.5"/>
        <line x1=${cx} y1=${headY+12} x2=${cx} y2=${torsoY} stroke=${color} stroke-width=${SW+1.5} stroke-linecap="round"/>
        <line x1=${cx} y1=${torsoY} x2=${hipX} y2=${hipY} stroke=${color} stroke-width=${SW+1.5} stroke-linecap="round"/>
        <line x1=${hipX} y1=${hipY} x2=${kneeX} y2=${kneeY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${kneeX} y1=${kneeY} x2=${footX} y2=${footY} stroke=${color} stroke-width=${SW} stroke-linecap="round"/>
        <line x1=${hipX} y1=${hipY} x2=${otherKneeX} y2=${otherKneeY} stroke=${color} stroke-width=${SW} stroke-linecap="round" opacity="0.5"/>
        <line x1=${otherKneeX} y1=${otherKneeY} x2=${otherFootX} y2=${otherFootY} stroke=${color} stroke-width=${SW} stroke-linecap="round" opacity="0.5"/>
        <circle cx=${cx} cy=${headY} r="11" fill=${color+"44"} stroke=${color} stroke-width="2.5"/>
        <circle cx=${cx} cy=${torsoY} r=${JR} fill=${color}/>
        <circle cx=${hipX} cy=${hipY} r=${JR} fill=${color}/>
        <circle cx=${kneeX} cy=${kneeY} r=${JR} fill=${color}/>
        <circle cx=${footX} cy=${footY} r=${JR-1} fill=${color} opacity="0.5"/>
        <circle cx=${otherKneeX} cy=${otherKneeY} r=${JR-1} fill=${color} opacity="0.5"/>
        <circle cx=${otherFootX} cy=${otherFootY} r=${JR-1} fill=${color} opacity="0.5"/>
        <text x=${cx} y="101" text-anchor="middle" fill="rgba(128,128,128,0.6)" font-size="8.5" font-family="'Noto Sans KR',sans-serif">옆으로 · 무릎 90도</text>
      </svg>`;
    }

    function ExerciseImage({exercise, th, showGuide=true}) {
      const imgUrl = `https://img.youtube.com/vi/${exercise.shortsId}/hqdefault.jpg`;
      const [guideOpen, setGuideOpen] = useState(true);
      const toggleGuide = () => setGuideOpen(v=>!v);
      
      return html`
      <div style=${{width:"100%",maxWidth:340}}>
        <div style=${{position:"relative",borderRadius:14,overflow:"hidden",border:"1px solid "+th.borderSub}}>
          <img src=${imgUrl} alt=${exercise.name} style=${{width:"100%",display:"block"}} onError=${e=>e.target.style.display="none"}/>
          <button onClick=${()=>window.open(`https://youtube.com/shorts/${exercise.shortsId}`,"_blank")} style=${{position:"absolute",bottom:8,right:8,background:"rgba(255,0,0,0.9)",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",color:"white",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:4}}>
            <span>▶</span><span>쇼츠</span>
          </button>
        </div>
        
        <div style=${{marginTop:10,background:th.surface,borderRadius:12,border:"1px solid "+th.border,padding:"12px"}}>
          <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,cursor:"pointer"}} onClick=${toggleGuide}>
            <span style=${{fontSize:13,fontWeight:700,color:th.text}}>📋 자세 가이드</span>
            <span style=${{color:th.textMute,fontSize:12}}>${guideOpen?"▲":"▼"}</span>
          </div>
          
          ${guideOpen && showGuide && html`
          <div style=${{fontSize:12,color:th.textSub,lineHeight:1.6,marginBottom:12}}>${exercise.guide.description}</div>
          
          <div style=${{marginBottom:10}}>
            <div style=${{fontSize:11,fontWeight:700,color:"#FF6B35",marginBottom:6}}>✅ 핵심 포인트</div>
            ${exercise.guide.keyPoints.map((p,i)=>html`<div key=${i} style=${{fontSize:11,color:th.textSub,marginBottom:4,paddingLeft:10}}>• ${p}</div>`)}
          </div>
          
          <div style=${{marginBottom:10}}>
            <div style=${{fontSize:11,fontWeight:700,color:"#FFE66D",marginBottom:6}}>⚠️ 주의사항</div>
            ${exercise.guide.warning.map((w,i)=>html`<div key=${i} style=${{fontSize:11,color:th.textSub,marginBottom:4,paddingLeft:10}}>• ${w}</div>`)}
          </div>
          
          <div>
            <div style=${{fontSize:11,fontWeight:700,color:"#4ECDC4",marginBottom:6}}>💡 팁</div>
            ${exercise.guide.tips.map((t,i)=>html`<div key=${i} style=${{fontSize:11,color:th.textSub,marginBottom:4,paddingLeft:10}}>• ${t}</div>`)}
          </div>
          `}
        </div>
      </div>`;
    }

    function ExerciseImageCompact({exercise, th, onPause}) {

        fn(...a);
        setTimeout(()=>{b.current=false;},delay);
      },[fn,delay]);

    function getTodayStr(){return new Date().toISOString().split("T")[0];}
    function getWeekStart(date){const d=new Date(date);d.setDate(d.getDate()-d.getDay());return d.toISOString().split("T")[0];}
    function getMonthStart(date){return date.substring(0,7);}

    function getStats(records) {
      const today = getTodayStr();
      const weekStart = getWeekStart(today);
      const monthStart = getMonthStart(today);
      const yearStart = today.substring(0,4);
      let totalTime=0,totalSets=0,totalExercises=0,totalCalories=0;
      let todayCount=0,weekCount=0,monthCount=0,yearCount=0;
      let dailyStats={},weeklyStats={},monthlyStats={};
      let streak=0, maxStreak=0, lastDate=null;
      const sorted = [...records].sort((a,b)=>a.timestamp-b.timestamp);
      sorted.forEach(r => {
        const dStr = new Date(r.timestamp).toISOString().split("T")[0];
        const wStr = getWeekStart(dStr);
        totalTime += r.elapsed;
        totalSets += r.sets;
        totalExercises += r.sets * r.exerciseCount;
        const cal = r.exercises.reduce((sum,e) => sum + (CALORIES_PER_EXERCISE[e.id]||0.3)*r.sets, 0);
        totalCalories += cal;
        if(dStr === today) todayCount++;
        if(dStr >= weekStart) weekCount++;
        if(dStr >= monthStart) monthCount++;
        if(dStr >= yearStart) yearCount++;
        dailyStats[dStr] = (dailyStats[dStr]||0) + r.elapsed;
        weeklyStats[wStr] = (weeklyStats[wStr]||0) + r.elapsed;
        if(lastDate) {
          const diff = (new Date(dStr)-new Date(lastDate))/(1000*60*60*24);
          if(diff===1){streak++;maxStreak=Math.max(maxStreak,streak);}
          else if(diff>1){streak=1;}
        }else{streak=1;maxStreak=1;}
        lastDate = dStr;
      });
      return {totalTime,totalSets,totalExercises,totalCalories,todayCount,weekCount,monthCount,yearCount,dailyStats,weeklyStats,monthlyStats,streak,maxStreak,recordCount:records.length};
    }

    function WorkoutApp() {
      const [themeKey, setThemeKey] = useState("dark");
      const th = THEMES[themeKey];

      const [exercises, setExercises] = useState(BASE_EXERCISES.map(e=>({...e})));
      const [totalSets, setTotalSets] = useState(3);
      const [currentSet, setCurrentSet] = useState(1);
      const [currentIdx, setCurrentIdx] = useState(null);
      const [status, setStatus] = useState("idle");
      const [timeLeft, setTimeLeft] = useState(0);
      const [paused, setPaused] = useState(false);
      const [repCount, setRepCount] = useState(0);
      const [restTime, setRestTime] = useState(0);
      const [restDuration, setRestDuration] = useState(15);
      const [restPaused, setRestPaused] = useState(false);
      const [completed, setCompleted] = useState([]);
      const [showAnim, setShowAnim] = useState(true);
      const [showGuideIdx, setShowGuideIdx] = useState(null);
      const [totalElapsed, setTotalElapsed] = useState(0);
      const [soundOn, setSoundOn] = useState(true);
      const [bgmOn, setBgmOn] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [showStats, setShowStats] = useState(false);
      const [showGoals, setShowGoals] = useState(false);
      const [showCustomize, setShowCustomize] = useState(false);
      const [showSaveConfirm, setShowSaveConfirm] = useState(false);
      const [activePreset, setActivePreset] = useState(null);
      const [records, setRecords] = useState(()=>{try{return JSON.parse(localStorage.getItem("workout_records")||"[]");}catch{return [];}});
      const [goals, setGoals] = useState(()=>{try{return JSON.parse(localStorage.getItem("workout_goals")||"null");}catch{return null;}});
      const [goalAchieved, setGoalAchieved] = useState(null);

      const {sfx, startBGM, stopBGM} = useSoundEngine(soundOn);

      const intervalRef = useRef(null);
      const pausedRef = useRef(false);
      const restPausedRef = useRef(false);
      const totalTimerRef = useRef(null);
      const totalPausedRef = useRef(false);
      const elapsedRef = useRef(0);
      const recordsRef = useRef(records);
      const savedRef = useRef(false);

      const doBeep = useCallback((fn)=>{if(soundOn)fn();},[soundOn]);
      const ex = currentIdx!==null ? exercises[currentIdx] : null;

      useEffect(()=>{pausedRef.current = paused;},[paused]);
      useEffect(()=>{restPausedRef.current = restPaused;},[restPaused]);
      useEffect(()=>{elapsedRef.current = totalElapsed;},[totalElapsed]);
      useEffect(()=>{recordsRef.current = records;},[records]);

      useEffect(()=>{
        if(bgmOn && status==="active" && !paused) startBGM();
        else stopBGM();
      },[bgmOn, status, paused, startBGM, stopBGM]);

      useEffect(()=>{
        const fn = () => {
          if(document.hidden) {
            totalPausedRef.current = true;
            pausedRef.current=true; restPausedRef.current=true;
          }else{
            totalPausedRef.current = pausedRef.current || restPausedRef.current;
          }
        };
        document.addEventListener("visibilitychange",fn);
        window.addEventListener("blur",fn);
        return()=>{document.removeEventListener("visibilitychange",fn);window.removeEventListener("blur",fn);};
      },[]);

useEffect(()=>{
        if(status==="idle" || status==="done") return;
        totalTimerRef.current = setInterval(()=>{
          if(pausedRef.current || restPausedRef.current || totalPausedRef.current) return;
          setTotalElapsed(t=>t+1);
        },1000);
        return()=>clearInterval(totalTimerRef.current);
      },[status]);

      useEffect(()=>{
        if(status==="active" && ex?.type==="timer"){
          intervalRef.current = setInterval(()=>{
            if(pausedRef.current) return;
            setTimeLeft(t => {
              if(t<=3 && t>1) doBeep(sfx.count);
              if(t<=1){clearInterval(intervalRef.current); doBeep(sfx.done); handleExerciseDone(); return 0;}
              return t-1;
            });
          },1000);
        }
        if(status==="rest"){
          intervalRef.current = setInterval(()=>{
            if(restPausedRef.current) return;
            setRestTime(t => {
              if(t<=3 && t>1) doBeep(sfx.count);
              if(t<=1){
                clearInterval(intervalRef.current); doBeep(sfx.start);
                const ni = currentIdx+1;
                if(ni >= exercises.length){
                  setCurrentSet(s => {
                    const ns = s+1;
                    if(ns > totalSets){ setStatus("done"); return s; }
                    setTimeout(()=>startExercise(0),0);
                    return ns;
                  });
                }else startExercise(ni);
                return 0;
              }
              return t-1;
            });
          },1000);
        }
        return()=>clearInterval(intervalRef.current);
      },[status, currentIdx, ex, exercises.length, totalSets, doBeep, sfx]);

      useEffect(()=>{
        if(status==="done" && !savedRef.current){
          savedRef.current = true;
          doSaveRecord();
          doBeep(sfx.finish);
        }
        if(status!=="done") savedRef.current = false;
      },[status, doBeep, sfx]);

      function doSaveRecord() {
        const r = {timestamp:Date.now(), elapsed:elapsedRef.current, sets:totalSets, exerciseCount:exercises.length, exercises:exercises.map(e=>({id:e.id, emoji:e.emoji, name:e.name})), preset:activePreset?PRESETS[activePreset]?.label:null};
        const nr = [...recordsRef.current, r];
        setRecords(nr); recordsRef.current = nr;
        try{localStorage.setItem("workout_records",JSON.stringify(nr));}catch{}
        if(goals){
          const s = getStats(nr);
          if(s.weekCount===goals.weekly && !goalAchieved){setGoalAchieved("weekly"); doBeep(sfx.finish);}
          else if(s.monthCount===goals.monthly && !goalAchieved){setGoalAchieved("monthly"); doBeep(sfx.finish);}
          else if(s.yearCount===goals.yearly && !goalAchieved){setGoalAchieved("yearly"); doBeep(sfx.finish);}
        }
      }

      function startExercise(idx){
        setCurrentIdx(idx); setStatus("active"); setRepCount(0);
        setPaused(false); pausedRef.current=false; totalPausedRef.current=false;
        if(exercises[idx].type==="timer") setTimeLeft(exercises[idx].value);
      }

      function handleExerciseDone(){
        setCompleted(c => [...c, exercises[currentIdx].id]);
        setStatus("rest"); setRestTime(restDuration); setRestPaused(false);
        restPausedRef.current=false; totalPausedRef.current=false; doBeep(sfx.rest);
      }

      function handleRepTap(){
        setRepCount(prev => {
          const n = prev+1;
          if(n >= ex.value) setTimeout(()=>{doBeep(sfx.done); handleExerciseDone();},300);
          else doBeep(sfx.repDone);
          return n;
        });
      }

      function handleSkipRest(){
        clearInterval(intervalRef.current);
        const ni = currentIdx+1;
        if(ni >= exercises.length){
          const ns = currentSet+1;
          if(ns > totalSets){ setStatus("done"); }
          else{ setCurrentSet(ns); startExercise(0); }
        }else{
          startExercise(ni);
        }
      }

      function handleHomeBtn(){setShowSaveConfirm(true);}

      function doFullReset(){
        clearInterval(intervalRef.current); clearInterval(totalTimerRef.current); stopBGM();
        setCurrentIdx(null); setStatus("idle"); setRepCount(0); setCompleted([]);
        setCurrentSet(1); setPaused(false); setRestPaused(false); setTotalElapsed(0);
        setGoalAchieved(null);
        pausedRef.current=false; restPausedRef.current=false; totalPausedRef.current=false;
        setShowSaveConfirm(false); savedRef.current=false;
      }

      function deleteRecord(i){
        const nr = records.filter((_,j) => j!==i);
        setRecords(nr); recordsRef.current = nr;
        try{localStorage.setItem("workout_records",JSON.stringify(nr));}catch{}
      }

      function deleteAllRecords(){
        setRecords([]); recordsRef.current = [];
        try{localStorage.removeItem("workout_records");}catch{}
      }

      function applyPreset(k){
        const p = PRESETS[k];
        setActivePreset(k);
        setTotalSets(p.sets);
        setRestDuration(p.rest);
        setExercises(prev => prev.map(e => ({...e, value:p.values[e.id]??e.value})));
      }

      function updateValue(id, v){
        setExercises(prev => prev.map(e => e.id===id ? {...e, value:v} : e));
      }

      const RS = {display:"flex",gap:10,width:"100%",maxWidth:300};
      const fT = (s) => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

      return html`
      <div style=${{minHeight:"100vh",background:th.bg,fontFamily:"'Noto Sans KR',sans-serif",color:th.text,paddingBottom:130,transition:"background 0.3s"}}>
        ${showCustomize && html`<${CustomizeModal} exercises=${exercises} onSave=${(l)=>{setExercises(l); setShowCustomize(false);}} onClose=${()=>setShowCustomize(false)} th=${th}/>`}
        ${showHistory && html`<${HistoryModal} records=${records} onClose=${()=>setShowHistory(false)} onDelete=${deleteRecord} onDeleteAll=${deleteAllRecords} th=${th}/>`}
        ${showStats && html`<${StatsModal} records=${records} onClose=${()=>setShowStats(false)} th=${th}/>`}
        ${showGoals && html`<${GoalsModal} goals=${goals} onSave=${(g)=>{setGoals(g);try{localStorage.setItem("workout_goals",JSON.stringify(g));}catch{};setShowGoals(false);}} onClose=${()=>setShowGoals(false)} th=${th}/>`}
        ${showSaveConfirm && html`<${SaveConfirmModal} elapsed=${totalElapsed} onSave=${()=>{doSaveRecord(); doFullReset();}} onDiscard=${doFullReset} onCancel=${()=>setShowSaveConfirm(false)} th=${th}/>`}

        <div style=${{padding:"22px 16px 13px",borderBottom:"1px solid "+th.headerBorder}}>
          <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:(status==="active"||status==="rest")?10:0}}>
            <div>
              <div style=${{fontSize:10,letterSpacing:4,color:"#FF6B35",fontWeight:700,marginBottom:3}}>홈 트레이닝</div>
              <div style=${{fontSize:22,fontFamily:"'Bebas Neue',sans-serif",letterSpacing:2,lineHeight:1}}>전신 체력 루틴</div>
            </div>
            <div style=${{display:"flex",alignItems:"center",gap:6}}>
              ${(status==="active"||status==="rest") && html`<${SafeBtn} onClick=${handleHomeBtn} style=${{padding:"5px 11px",borderRadius:20,background:th.surface,border:"1px solid "+th.border,color:th.textSub,fontSize:11}}>⬅ 처음으로</${SafeBtn}>`}
              <${SafeBtn} onClick=${()=>setThemeKey(k=>k==="dark"?"light":"dark")} style=${{width:32,height:32,borderRadius:10,background:th.surface,border:"1px solid "+th.border,color:th.text,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}} delay=${200}>${themeKey==="dark"?"☀️":"🌙"}</${SafeBtn}>
              <${SafeBtn} onClick=${()=>setBgmOn(v=>{const next=!v;if(!next)stopBGM();return next;})} style=${{width:32,height:32,borderRadius:10,background:bgmOn?"rgba(255,230,109,0.15)":th.surface,border:"1px solid "+(bgmOn?"rgba(255,230,109,0.4)":th.border),color:bgmOn?"#d4a00a":th.textSub,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}} delay=${200}>🎵</${SafeBtn}>
              <${SafeBtn} onClick=${()=>setSoundOn(v=>!v)} style=${{width:32,height:32,borderRadius:10,background:soundOn?"rgba(78,205,196,0.15)":th.surface,border:"1px solid "+(soundOn?"rgba(78,205,196,0.4)":th.border),color:soundOn?"#4ECDC4":th.textSub,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}} delay=${200}>${soundOn?"🔔":"🔕"}</${SafeBtn}>
              ${status==="idle" && html`<${SafeBtn} onClick=${()=>setShowHistory(true)} style=${{width:32,height:32,borderRadius:10,background:th.surface,border:"1px solid "+th.border,color:th.textSub,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>📋</${SafeBtn}>`}
              ${status==="idle" && html`<${SafeBtn} onClick=${()=>setShowStats(true)} style=${{width:32,height:32,borderRadius:10,background:th.surface,border:"1px solid "+th.border,color:th.textSub,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>📊</${SafeBtn}>`}
              ${status==="idle" && html`<${SafeBtn} onClick=${()=>setShowGoals(true)} style=${{width:32,height:32,borderRadius:10,background:th.surface,border:"1px solid "+th.border,color:th.textSub,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>🎯</${SafeBtn}>`}
              <div style=${{background:"rgba(255,107,53,0.15)",border:"1px solid rgba(255,107,53,0.3)",borderRadius:20,padding:"5px 12px",fontSize:12,color:"#FF6B35"}}>${completed.length}/${exercises.length}</div>
            </div>
          </div>
          ${(status==="active"||status==="rest"||status==="done") && html`
          <div style=${{display:"flex",alignItems:"center",gap:10,background:th.surface,borderRadius:10,padding:"7px 12px",border:"1px solid "+th.borderSub}}>
            <span style=${{fontSize:10,color:th.textMute,letterSpacing:2}}>총 소요시간</span>
            <span style=${{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:3,color:(paused||restPaused)?"rgba(150,150,150,0.5)":th.text}}>${fT(totalElapsed)}</span>
            ${(paused||restPaused) && html`<span style=${{fontSize:9,color:th.textMute}}>⏸ 일시정지</span>`}
            <span style=${{fontSize:10,marginLeft:"auto",color:th.textMute}}>🔥 ${Math.round(totalElapsed*0.35)}</span>
            ${status==="done" && html`<span style=${{fontSize:9,color:"#FFE66D",marginLeft:4}}>완료 🎉</span>`}
          </div>`}
        </div>

        ${status==="idle" && html`
        <div style=${{padding:"12px 14px 0"}}>
          <div style=${{marginBottom:14}}>
            <div style=${{fontSize:10,color:th.textMute,letterSpacing:2,marginBottom:8,textAlign:"center"}}>난이도 프리셋</div>
            <div style=${{display:"flex",gap:8}}>
              ${Object.entries(PRESETS).map(([k,p]) => html`
                <button key=${k} onClick=${()=>applyPreset(k)} style=${{flex:1,padding:"10px 6px",borderRadius:12,background:activePreset===k?p.color+"22":th.surface,border:"1px solid "+(activePreset===k?p.color+"66":th.border),color:activePreset===k?p.color:th.textSub,cursor:"pointer",WebkitTapHighlightColor:"transparent",transition:"all 0.2s"}}>
                  <div style=${{fontSize:18,marginBottom:3}}>${p.emoji}</div>
                  <div style=${{fontSize:12,fontWeight:700,fontFamily:"'Noto Sans KR',sans-serif"}}>${p.label}</div>
                  <div style=${{fontSize:9,color:activePreset===k?p.color+"cc":th.textMute,marginTop:2}}>${p.desc}</div>
                </button>
              `)}
            </div>
          </div>
          <div style=${{display:"flex",gap:8,marginBottom:12}}>
            ${[{label:"🔁 세트 수",sub:"전체 반복",val:totalSets,set:v=>{setTotalSets(v);setActivePreset(null);},min:1,max:10,unit:"세트",col:"#FF6B35"},{label:"⏱ 휴식시간",sub:"운동 사이",val:restDuration,set:v=>{setRestDuration(v);setActivePreset(null);},min:5,max:120,unit:"초",col:"#4ECDC4"}].map((c,i) => html`
              <div key=${i} style=${{flex:1,display:"flex",flexDirection:"column",gap:5,background:th.surface,border:"1px solid "+th.borderSub,borderRadius:12,padding:"10px 12px"}}>
                <div style=${{fontSize:11,fontWeight:700,color:th.text}}>${c.label}</div>
                <div style=${{fontSize:9,color:th.textMute,marginBottom:2}}>${c.sub}</div>
                <div style=${{display:"flex",alignItems:"center",gap:4}}>
                  <${Stepper} value=${c.val} min=${c.min} max=${c.max} onChange=${c.set} color=${c.col} th=${th}/>
                  <div style=${{fontSize:10,color:th.textMute}}>${c.unit}</div>
                </div>
              </div>
            `)}
          </div>
          <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style=${{fontSize:11,color:th.textMute}}>운동 목록 (${exercises.length}가지)</div>
            <${SafeBtn} onClick=${()=>setShowCustomize(true)} style=${{padding:"5px 10px",borderRadius:8,background:th.surface,border:"1px solid "+th.border,color:th.textSub,fontSize:11}}>🛠 편집</${SafeBtn}>
          </div>
          <div style=${{marginBottom:14}}>
            ${exercises.map(e => html`
              <div key=${e.id} style=${{marginBottom:7,borderRadius:13,background:completed.includes(e.id)?th.surface:th.surfaceHover,border:"1px solid "+(completed.includes(e.id)?th.borderSub:th.border),opacity:completed.includes(e.id)?0.55:1,transition:"all 0.2s"}}>
                <div style=${{display:"flex",alignItems:"center",gap:8,padding:"9px 10px"}}>
                  <div style=${{width:34,height:34,borderRadius:9,flexShrink:0,background:e.color+"22",border:"1px solid "+e.color+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>${completed.includes(e.id)?"✓":e.emoji}</div>
                  <div style=${{flex:1,minWidth:0}}>
                    <div style=${{fontWeight:700,fontSize:13,marginBottom:1,color:th.text}}>${e.name}</div>
                    <div style=${{fontSize:9,color:th.textMute,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${e.effect}</div>
                  </div>
                  <${SafeBtn} onClick=${()=>setShowGuideIdx(showGuideIdx===e.id?null:e.id)} style=${{background:showGuideIdx===e.id?e.color+"28":th.surface,border:"1px solid "+(showGuideIdx===e.id?e.color+"55":th.border),borderRadius:8,padding:"5px 8px",color:showGuideIdx===e.id?e.color:th.textMute,fontSize:10,flexShrink:0}}>${showGuideIdx===e.id?"📋":"👀"}</${SafeBtn}>
                  ${e.shortsId ? html`<button onClick=${()=>window.open(`https://youtube.com/shorts/${e.shortsId}`,"_blank")} style=${{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,width:40,height:36,flexShrink:0,background:e.color+"18",border:"1px solid "+e.color+"44",borderRadius:8,cursor:"pointer",color:e.color,padding:"4px 2px",WebkitTapHighlightColor:"transparent"}}><span style=${{fontSize:13}}>▶</span><span style=${{fontSize:6,fontFamily:"'Noto Sans KR',sans-serif",fontWeight:700,lineHeight:1}}>영상</span></button>` : ''}
                  <${Stepper} value=${e.value} min=${e.type==="timer"?5:1} max=${e.type==="timer"?180:60} onChange=${v=>{updateValue(e.id,v);setActivePreset(null);}} color=${e.color} th=${th}/>
                  <div style=${{fontSize:10,color:th.textMute,flexShrink:0}}>${e.unit}</div>
                </div>
                ${showGuideIdx===e.id && html`
                <div style=${{padding:"0 12px 12px",borderTop:"1px solid "+th.borderSub,marginTop:2}}>
                  <div style=${{fontSize:11,color:th.textSub,lineHeight:1.5,marginBottom:8,marginTop:8}}>${e.guide.description}</div>
                  <div style=${{fontSize:10,color:"#FF6B35",marginBottom:4}}>✅ ${e.guide.keyPoints[0]}</div>
                  <div style=${{fontSize:10,color:"#FFE66D",marginBottom:4}}>⚠️ ${e.guide.warning[0]}</div>
                  <div style=${{fontSize:10,color:"#4ECDC4"}}>💡 ${e.guide.tips[0]}</div>
                </div>
                `}
              </div>
            `)}
          </div>
          <${SafeBtn} onClick=${()=>{setCurrentSet(1);startExercise(0);doBeep(sfx.start);}} style=${{width:"100%",padding:"16px",background:"linear-gradient(135deg,#FF6B35,#ff8c5a)",borderRadius:14,color:"white",fontSize:16,letterSpacing:1,boxShadow:"0 8px 32px rgba(255,107,53,0.35)"}}>🔥 운동 시작 (${totalSets}세트)</${SafeBtn}>
        </div>
        `}

        ${status==="active" && ex && html`
        <div style=${{padding:"12px 14px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:11}}>
          <div style=${{display:"flex",gap:4,alignSelf:"stretch"}}>
            ${exercises.map((e,i) => html`<div key=${e.id} style=${{flex:1,height:3,borderRadius:2,background:i<currentIdx?"#FF6B35":i===currentIdx?th.text:th.dot,transition:"background 0.3s"}}/>`)}
          </div>
          <div style=${{alignSelf:"stretch",display:"flex",justifyContent:"center",gap:6}}>
            ${Array.from({length:totalSets}).map((_,i) => html`<div key=${i} style=${{width:8,height:8,borderRadius:"50%",background:i<currentSet-1?"#FF6B35":i===currentSet-1?th.text:th.dot,transition:"background 0.3s"}}/>`)}
            <span style=${{fontSize:9,color:th.textMute,marginLeft:4,lineHeight:"8px"}}>${currentSet}/${totalSets} 세트</span>
          </div>
          <div style=${{display:"flex",alignItems:"center",gap:10,alignSelf:"stretch"}}>
            <div style=${{width:32,height:32,borderRadius:8,flexShrink:0,background:ex.color+"22",border:"1px solid "+ex.color+"55",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>${ex.emoji}</div>
            <div style=${{flex:1}}>
              <div style=${{fontSize:9,color:th.textMute,letterSpacing:2}}>${currentIdx+1} / ${exercises.length}</div>
              <div style=${{fontSize:17,fontFamily:"'Bebas Neue',sans-serif",letterSpacing:1}}>${ex.name}</div>
            </div>
            <${SafeBtn} onClick=${()=>setShowAnim(v=>!v)} style=${{background:showAnim?ex.color+"28":th.surface,border:"1px solid "+(showAnim?ex.color+"55":th.border),borderRadius:8,padding:"5px 9px",color:showAnim?ex.color:th.textMute,fontSize:11}}>${showAnim?"📋 가이드":"🤸 숨기기"}</${SafeBtn}>
          </div>
          ${showAnim && html`
          <div style=${{display:"flex",gap:10,width:"100%",maxWidth:380,alignSelf:"center"}}>
            <div style=${{flex:"0 0 120px",borderRadius:10,overflow:"hidden"}}>
              <${ExerciseImageCompact} exercise=${ex} th=${th} onPause=${()=>setPaused(true)}/>
            </div>
            <div style=${{flex:1,background:th.surface,borderRadius:10,padding:"11px",fontSize:11,color:th.textSub}}>
              <div style=${{marginBottom:5,fontWeight:700,color:th.text}}>📋 ${ex.name}</div>
              <div style=${{marginBottom:5,lineHeight:1.4}}>${ex.guide.description}</div>
              <div style=${{color:"#FF6B35",marginBottom:2}}>✅ ${ex.guide.keyPoints[0]}</div>
              <div style=${{color:"#FFE66D",marginBottom:2}}>⚠️ ${ex.guide.warning[0]}</div>
              <div style=${{color:"#4ECDC4"}}>💡 ${ex.guide.tips[0]}</div>
            </div>
          </div>
          `}
          ${ex.type==="timer" ? html`<${TimerCircle} total=${ex.value} remaining=${timeLeft} paused=${paused} th=${th}/>` : html`<${RepCounter} total=${ex.value} current=${repCount} onTap=${handleRepTap} color=${ex.color} th=${th}/>`}
          <div style=${{display:"flex",gap:8,width:"100%",maxWidth:340}}>
            ${ex.type==="timer" && html`<${SafeBtn} onClick=${()=>setPaused(p=>{totalPausedRef.current = false; return !p;})} style=${{flex:1,padding:"13px",background:paused?"rgba(255,255,255,0.14)":th.surface,border:"1px solid "+th.border,borderRadius:12,color:th.text,fontSize:14}}>${paused?"▶ 재개":"⏸ 일시정지"}</${SafeBtn}>`}
            ${ex.type==="reps" && html`<${SafeBtn} onClick=${handleExerciseDone} style=${{flex:2,padding:"13px",background:th.surface,border:"1px solid "+th.border,borderRadius:12,color:th.text,fontSize:14}}>완료 ✓</${SafeBtn}>`}
            <${SafeBtn} onClick=${handleExerciseDone} style=${{flex:1,padding:"13px",background:"rgba(255,107,53,0.12)",border:"1px solid rgba(255,107,53,0.28)",borderRadius:12,color:"#FF6B35",fontSize:14}}>스킵 ⏭</${SafeBtn}>
          </div>
        </div>
        `}

        ${status==="rest" && html`
        <div style=${{padding:"22px 16px",display:"flex",flexDirection:"column",alignItems:"center",gap:13,textAlign:"center"}}>
          <div style=${{fontSize:38}}>😤</div>
          <div>
            <div style=${{fontSize:10,letterSpacing:4,color:"#4ECDC4",marginBottom:5}}>GOOD WORK!</div>
            <div style=${{fontSize:20,fontFamily:"'Bebas Neue',sans-serif",letterSpacing:2}}>${currentIdx+1<exercises.length?"다음: "+exercises[currentIdx+1].name:"마지막 완료!"}</div>
          </div>
          ${(()=>{const r=42,circ=2*Math.PI*r;return html`<svg width="100" height="100" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r=${r} fill="none" stroke=${th.timerStroke} stroke-width="6"/>
            <circle cx="50" cy="50" r=${r} fill="none" stroke=${restPaused?"rgba(150,150,150,0.4)":"#4ECDC4"} stroke-width="6" stroke-dasharray=${circ} stroke-dashoffset=${(1-restTime/restDuration)*circ} stroke-linecap="round" transform="rotate(-90 50 50)" style=${{transition:restPaused?"none":"stroke-dashoffset 1s linear"}}/>
            <text x="50" y="45" text-anchor="middle" fill=${th.text} font-size="22" font-weight="700" font-family="'Bebas Neue',sans-serif">${restTime}</text>
            <text x="50" y="60" text-anchor="middle" fill=${th.textMute} font-size="10" font-family="'Noto Sans KR',sans-serif">${restPaused?"일시정지":"초 휴식"}</text>
          </svg>`;})()}
          <div style=${RS}>
            <${SafeBtn} onClick=${()=>setRestPaused(p=>{totalPausedRef.current = false; return !p;})} style=${{flex:1,padding:"12px",borderRadius:12,background:restPaused?"rgba(255,255,255,0.14)":th.surface,border:"1px solid "+th.border,color:th.text,fontSize:13}}>${restPaused?"▶ 재개":"⏸ 멈추기"}</${SafeBtn}>
            <${SafeBtn} onClick=${handleSkipRest} style=${{flex:1,padding:"12px",borderRadius:12,background:"rgba(78,205,196,0.12)",border:"1px solid rgba(78,205,196,0.3)",color:"#4ECDC4",fontSize:13}}>바로 시작 ⏭</${SafeBtn}>
          </div>
          ${currentIdx+1<exercises.length && exercises[currentIdx+1].shortsId && html`
          <button onClick=${()=>window.open(`https://youtube.com/shorts/${exercises[currentIdx+1].shortsId}`,"_blank")} style=${{padding:"8px 18px",borderRadius:20,background:"none",border:"1px solid "+th.border,color:th.textMute,fontSize:12,marginTop:8,WebkitTapHighlightColor:"transparent",cursor:"pointer"}}>다음 운동 쇼츠 보기 →</button>
          `}
        </div>
        `}

        ${status==="done" && html`
        <div style=${{padding:"44px 16px",display:"flex",flexDirection:"column",alignItems:"center",gap:16,textAlign:"center"}}>
          <div style=${{fontSize:52}}>🎉</div>
          <div>
            <div style=${{fontSize:10,letterSpacing:4,color:"#FFE66D",marginBottom:7}}>WORKOUT COMPLETE</div>
            <div style=${{fontSize:26,fontFamily:"'Bebas Neue',sans-serif",letterSpacing:2,marginBottom:6}}>전신 루틴 완료!</div>
            <div style=${{fontSize:13,color:th.textSub,lineHeight:1.8}}>${totalSets}세트 × ${exercises.length}가지 완료!<br/>오늘도 수고했습니다 💪</div>
          </div>
          <div style=${{background:"rgba(255,230,109,0.08)",border:"1px solid rgba(255,230,109,0.2)",borderRadius:12,padding:"10px 24px"}}>
            <div style=${{fontSize:10,color:th.textMute,letterSpacing:2,marginBottom:3}}>총 소요시간</div>
            <div style=${{fontFamily:"'Bebas Neue',sans-serif",fontSize:32,letterSpacing:4,color:"#FFE66D"}}>${fT(totalElapsed)}</div>
          </div>
          <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,width:"100%",maxWidth:280}}>
            ${exercises.map(e => html`
              <div key=${e.id} style=${{padding:"9px 10px",background:th.surface,border:"1px solid rgba(255,230,109,0.18)",borderRadius:10,fontSize:11,color:th.textSub,display:"flex",alignItems:"center",gap:5}}>
                <span>${e.emoji}</span><span style=${{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${e.name} · ${e.value}${e.unit}</span>
              </div>
            `)}
          </div>
          <div style=${{display:"flex",gap:8,width:"100%",maxWidth:280}}>
            <${SafeBtn} onClick=${()=>setShowHistory(true)} style=${{flex:1,padding:"13px",borderRadius:14,background:th.surface,border:"1px solid "+th.border,color:th.textSub,fontSize:13}}>📋 기록</${SafeBtn}>
            <${SafeBtn} onClick=${doFullReset} style=${{flex:2,padding:"13px 24px",borderRadius:14,background:"linear-gradient(135deg,#FF6B35,#ff8c5a)",color:"white",fontSize:15,boxShadow:"0 8px 32px rgba(255,107,53,0.35)"}}>🔄 다시 하기</${SafeBtn}>
          </div>
        </div>
        `}
      </div>`;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${WorkoutApp}/>`);
  </script>
</body>
</html>
